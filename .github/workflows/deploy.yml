name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Deploying needs the checkout and nothing else; Netlify and Neon are reached
# with their own tokens.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    # A production push deploys; a pull request gets its own preview site backed
    # by its own Neon branch.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # A green preview deploy is a merge requirement, so missing configuration
      # has to fail loudly. Skipping would report success without having
      # verified anything.
      - name: Require credentials
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=()
          [ -n "$NETLIFY_AUTH_TOKEN" ] || missing+=(NETLIFY_AUTH_TOKEN)
          [ -n "$NETLIFY_SITE_ID" ] || missing+=(NETLIFY_SITE_ID)

          if [ "$IS_PRODUCTION" = 'true' ]; then
            [ -n "$DATABASE_URL" ] || missing+=(DATABASE_URL)
          else
            # Previews provision their own throwaway database branch.
            [ -n "$NEON_API_KEY" ] || missing+=(NEON_API_KEY)
            [ -n "$NEON_PROJECT_ID" ] || missing+=(NEON_PROJECT_ID)
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            echo "::error::Note that pull requests from forks cannot read secrets."
            exit 1
          fi

      - run: npm ci

      # Installed once: each `npx netlify-cli` invocation otherwise spends ~40s
      # resolving the package before it does any work.
      - name: Install the Netlify CLI
        run: npm install --global netlify-cli@27

      # One Neon branch per pull request, named after it. The action is
      # idempotent: a later push to the same PR reuses the existing branch.
      - name: Create the Neon branch for this pull request
        id: neon
        if: env.IS_PRODUCTION != 'true'
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_name: pr-${{ github.event.pull_request.number }}

      - name: Migrate and seed the preview database
        if: env.IS_PRODUCTION != 'true'
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: npm run db:seed

      # Points the preview at its own database.
      #
      # Both contexts are written: `branch:<head ref>` is what Netlify's git
      # integration resolves, and `deploy-preview` is what a manual CLI deploy
      # would match, since such a deploy carries no git branch.
      #
      # No `--scope` is passed: env:list showed the value already lands with
      # scope "All", which covers functions and runtime. Setting the scope
      # explicitly changed nothing, and it cannot be combined with --context on
      # an existing variable anyway ("Setting the context and scope at the same
      # time on an existing env var is not allowed").
      #
      # The deploy-preview value is shared, so two pull requests deploying at the
      # same moment can race for it. Netlify's git integration removes that.
      - name: Point the preview at its own database
        if: env.IS_PRODUCTION != 'true'
        env:
          DB_URL: ${{ steps.neon.outputs.db_url }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          netlify env:set DATABASE_URL "$DB_URL" --force \
            --context "branch:$HEAD_REF" deploy-preview

          # Prints the resulting configuration. This is what confirmed the value
          # is stored correctly and that the deploy-side behaviour below is not a
          # configuration mistake.
          netlify env:list --context deploy-preview

      - name: Apply database migrations
        if: env.IS_PRODUCTION == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate

      # `--build` runs the Netlify build pipeline, so the Next.js runtime plugin
      # and the scheduled function are wired up exactly as they are on Netlify.
      # `--alias` gives each pull request a stable preview URL.
      - name: Deploy
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$IS_PRODUCTION" = 'true' ]; then
            netlify deploy --build --prod --json > deploy.json
          else
            netlify deploy --build \
              --context deploy-preview \
              --alias "deploy-preview-$PR_NUMBER" --json > deploy.json
          fi
          url=$(jq -er '.deploy_url // .url' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      # Proves the deployment boots, and for production that it reached its
      # database. A preview cannot: see the demoMode branch below.
      - name: Smoke test the deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status='000'
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --show-error --location --max-time 20 \
              -o body.txt -w '%{http_code}' "$URL/api/health" || echo '000')
            [ "$status" = '200' ] && break
            echo "Attempt $attempt: HTTP $status — the deployment may still be starting."
            sleep 10
          done

          body=$(cat body.txt 2>/dev/null || true)
          echo "$body"

          if [ "$status" != '200' ]; then
            echo "::error::Health check for $URL returned HTTP $status"
            case "$body" in
              *app.netlify.com/edge-access*)
                echo "::error::The deploy is behind Netlify visitor access control: the"
                echo "::error::response redirects to app.netlify.com/edge-access, which asks"
                echo "::error::for a Netlify account login. That is an interactive flow, so"
                echo "::error::there is no header or token this job can send instead."
                echo "::error::Allow unauthenticated access for deploy previews under Site"
                echo "::error::configuration > Access & security > Visitor access."
                ;;
            esac
            case "$status" in
              401|403)
                echo '--- response headers ---'
                curl --silent --show-error --location --max-time 20 --head \
                  "$URL/api/health" || true
                ;;
            esac
            exit 1
          fi

          case "$body" in
            *'"status":"ok"'*) ;;
            *)
              echo "::error::$URL answered 200 but not with a healthy body."
              exit 1
              ;;
          esac

          # Production must reach the real database; a preview built by the CLI
          # cannot, so it only warns.
          #
          # `--alias` without `--prod` produces a draft deploy, and Netlify does
          # not inject the site's environment variables into a draft deploy's
          # functions at runtime (netlify/cli#6898). The env:list above proves
          # this is not a misconfiguration: DATABASE_URL is stored in the
          # deploy-preview context with scope "All", and the deploy still comes
          # up in demo mode. The CLI has no flag for a non-draft, non-production
          # deploy, so connecting the repository to Netlify's git integration is
          # the only way to close this gap. See README.
          case "$body" in
            *'"demoMode":true'*)
              if [ "$IS_PRODUCTION" = 'true' ]; then
                echo "::error::Production is running in demo mode — it did not pick up"
                echo "::error::DATABASE_URL, so it is not using the real database."
                echo "::error::Check DATABASE_URL in the Netlify production context."
                exit 1
              fi
              echo "::warning::The preview is up but running in demo mode, so it is not"
              echo "::warning::reading the pr-$PR_NUMBER Neon branch. Connecting the"
              echo "::warning::repository to Netlify's git integration fixes this — see the"
              echo "::warning::'PR ごとのプレビューと DB ブランチ' section of README.md."
              ;;
          esac
