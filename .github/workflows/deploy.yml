name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # A production push deploys; anything else gets a preview URL.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # A green preview deploy is a merge requirement, so missing configuration
      # has to fail loudly. Skipping would report success without having
      # verified anything.
      - name: Require Vercel credentials
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ] || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            echo "::error::Note that pull requests from forks cannot read secrets."
            exit 1
          fi

      - run: npm ci

      # Only production touches the real database. A preview must never migrate
      # it — previews run against whatever DATABASE_URL the Vercel preview
      # environment provides (or in demo mode when it has none).
      - name: Apply database migrations
        if: env.IS_PRODUCTION == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is required to deploy production."
            exit 1
          fi
          npm run db:migrate

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      - name: Build
        run: npx vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      # Proves the deployment actually boots and can reach its database, which
      # is the whole reason this job gates the merge.
      - name: Smoke test the deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          args=(--silent --show-error --location --fail --max-time 20)
          # Preview URLs are behind Vercel Deployment Protection unless a bypass
          # secret is configured; without it the health check would 401.
          if [ -n "$BYPASS" ]; then
            args+=(--header "x-vercel-protection-bypass: $BYPASS")
          fi

          body=''
          for attempt in 1 2 3 4 5; do
            if body=$(curl "${args[@]}" "$URL/api/health"); then
              break
            fi
            echo "Attempt $attempt failed; the deployment may still be starting."
            sleep 10
          done

          echo "$body"
          case "$body" in
            *'"status":"ok"'*) ;;
            *)
              echo "::error::Health check failed for $URL"
              exit 1
              ;;
          esac

      - name: Warn about demo mode
        env:
          BODY_URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          args=(--silent --location --fail --max-time 20)
          if [ -n "$BYPASS" ]; then
            args+=(--header "x-vercel-protection-bypass: $BYPASS")
          fi
          body=$(curl "${args[@]}" "$BODY_URL/api/health" || true)
          case "$body" in
            *'"demoMode":true'*)
              echo "::warning::$TARGET is running in demo mode — DATABASE_URL is" \
                   "not set in the Vercel $TARGET environment, so data is in-memory."
              ;;
          esac
