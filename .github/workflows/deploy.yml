name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    # A production push deploys; anything else gets a deploy preview URL.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    env:
      IS_PRODUCTION: ${{ github.ref == 'refs/heads/main' }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # A green preview deploy is a merge requirement, so missing configuration
      # has to fail loudly. Skipping would report success without having
      # verified anything.
      - name: Require Netlify credentials
        run: |
          missing=()
          [ -n "$NETLIFY_AUTH_TOKEN" ] || missing+=(NETLIFY_AUTH_TOKEN)
          [ -n "$NETLIFY_SITE_ID" ] || missing+=(NETLIFY_SITE_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}."
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            echo "::error::Note that pull requests from forks cannot read secrets."
            exit 1
          fi

      - run: npm ci

      # Only production touches the real database. A preview must never migrate
      # it — previews run against whatever DATABASE_URL the Netlify deploy
      # context provides (or in demo mode when it has none).
      - name: Apply database migrations
        if: env.IS_PRODUCTION == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is required to deploy production."
            exit 1
          fi
          npm run db:migrate

      # `--build` runs the Netlify build pipeline, so the Next.js runtime plugin
      # and the scheduled function are wired up exactly as they are on Netlify.
      - name: Deploy
        id: deploy
        run: |
          if [ "$IS_PRODUCTION" = 'true' ]; then
            npx --yes netlify-cli@27 deploy --build --prod --json > deploy.json
          else
            npx --yes netlify-cli@27 deploy --build --json > deploy.json
          fi
          url=$(jq -er '.deploy_url // .url' deploy.json)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"

      # Proves the deployment actually boots and can reach its database, which
      # is the whole reason this job gates the merge.
      - name: Smoke test the deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          body=''
          for attempt in 1 2 3 4 5; do
            if body=$(curl --silent --show-error --location --fail --max-time 20 \
              "$URL/api/health"); then
              break
            fi
            echo "Attempt $attempt failed; the deployment may still be starting."
            sleep 10
          done

          echo "$body"
          case "$body" in
            *'"status":"ok"'*) ;;
            *)
              echo "::error::Health check failed for $URL"
              exit 1
              ;;
          esac

          case "$body" in
            *'"demoMode":true'*)
              echo "::warning::This deploy is running in demo mode — DATABASE_URL is" \
                   "not set for its Netlify deploy context, so data is in-memory."
              ;;
          esac
